<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Food Random</title>
<style>
  body {
    background: #f0f2f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 350px;
  }
  h2 { margin-top: 0; font-size: 18px; }
  .box {
    background: #f9f9f9;
    border: 1px solid #ddd;
    padding: 15px;
    text-align: center;
    margin: 15px 0;
  }
  button {
    width: 100%;
    padding: 8px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  button:hover { background: #0056b3; }
  .checkboxes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    font-size: 14px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Safe Food Randomizer</h2>
  <p style="font-size: 13px; color: #666;">Check things to avoid:</p>
  
  <div class="checkboxes" id="cList"></div>

  <div class="box">
    <div id="status" style="font-size: 12px; color: #666;">Ready</div>
    <div id="result" style="font-size: 16px; font-weight: bold; margin-top: 5px;">Click random button</div>
  </div>

  <button onclick="pickFood()">Random</button>
  <div id="count" style="font-size: 12px; color: #666; margin-top: 10px; text-align: right;"></div>
</div>

<script>
  const tags = ["seafood", "fish", "peanut", "egg", "pork", "beef", "chicken", "dairy", "gluten", "spicy"];
  const foods = [
    {name: "Egg Fried Rice", type: ["egg", "gluten"]}, {name: "Tom Yum", type: ["seafood", "spicy"]},
    {name: "Papaya Salad", type: ["peanut", "spicy"]}, {name: "Pad Thai", type: ["seafood", "peanut", "gluten"]},
    {name: "Chicken Rice", type: ["chicken"]}, {name: "Pork Rice", type: ["pork", "gluten"]},
    {name: "Beef Soup", type: ["beef", "gluten"]}, {name: "Spaghetti", type: ["dairy", "pork", "gluten"]},
    {name: "Cheese Pizza", type: ["dairy", "gluten"]}, {name: "Burger", type: ["pork", "gluten", "egg"]},
    {name: "Green Curry", type: ["chicken", "spicy"]}, {name: "Omelet", type: ["egg", "pork"]},
    {name: "Fried Fish", type: ["fish"]}, {name: "Tofu Soup", type: ["pork"]},
    {name: "Duck Rice", type: ["pork"]}, {name: "Sukiyaki", type: ["seafood", "pork", "egg"]},
    {name: "Fish Soup", type: ["fish"]}, {name: "Larb Pork", type: ["pork", "spicy"]},
    {name: "Grilled Chicken", type: ["chicken"]}, {name: "Shrimp Cake", type: ["seafood", "gluten"]},
    {name: "Basil Chicken", type: ["chicken", "egg", "spicy"]}, {name: "Morning Glory", type: ["spicy"]},
    {name: "Crab Rice", type: ["seafood", "egg"]}, {name: "Salmon", type: ["fish"]}, {name: "Sushi", type: ["fish", "gluten"]}
  ];

  let cListDiv = document.getElementById('cList');
  tags.forEach(tag => {
    cListDiv.innerHTML += `<label><input type="checkbox" value="${tag}" onchange="updateList()"> ${tag}</label>`;
  });

  let available = [];
  function updateList() {
    // เปลี่ยนชื่อตัวแปรใน map และ filter ไม่ให้ซ้ำกับตัวแปรด้านนอก
    let checked = Array.from(document.querySelectorAll('input:checked')).map(input => input.value);
    available = foods.filter(food => !food.type.some(x => checked.includes(x)));
    
    document.getElementById('count').innerText = "Available: " + available.length + " items";
    
    if(available.length === 0) {
      document.getElementById('status').innerText = "Error";
      document.getElementById('result').innerText = "No food available!";
    } else {
      document.getElementById('status').innerText = "Ready";
      document.getElementById('result').innerText = "Click random button";
    }
  }

  function pickFood() {
    if(available.length === 0) {
      alert("Please uncheck some filters!");
      return;
    }
    let count = 0;
    document.getElementById('status').innerText = "Randomizing...";
    let timer = setInterval(() => {
      let random = available[Math.floor(Math.random() * available.length)].name;
      document.getElementById('result').innerText = random;
      count++;
      if(count > 8) {
        clearInterval(timer);
        document.getElementById('status').innerText = "Selected:";
      }
    }, 50);
  }

  updateList();
</script>

</body>
</html>
