<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Food Random</title>
<style>
  body {
    background: #f0f2f5;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 350px;
  }
  h2 { margin-top: 0; font-size: 18px; }
  .box {
    background: #f9f9f9;
    border: 1px solid #ddd;
    padding: 15px;
    text-align: center;
    margin: 15px 0;
  }
  button {
    width: 100%;
    padding: 8px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  button:hover { background: #0056b3; }
  .checkboxes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    font-size: 14px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Safe Food Randomizer</h2>
  <p style="font-size: 13px; color: #666;">Check things to avoid:</p>
  
  <div class="checkboxes" id="cList"></div>

  <div class="box">
    <div id="status" style="font-size: 12px; color: #666;">Ready</div>
    <div id="result" style="font-size: 16px; font-weight: bold; margin-top: 5px;">Click random button</div>
  </div>

  <button onclick="pickFood()">Random</button>
  <div id="count" style="font-size: 12px; color: #666; margin-top: 10px; text-align: right;"></div>
</div>

<script>
  const tags = ["seafood", "fish", "peanut", "egg", "pork", "beef", "chicken", "dairy", "gluten", "spicy"];
  const foods = [
    {n: "Egg Fried Rice", t: ["egg", "gluten"]}, {n: "Tom Yum", t: ["seafood", "spicy"]},
    {n: "Papaya Salad", t: ["peanut", "spicy"]}, {n: "Pad Thai", t: ["seafood", "peanut", "gluten"]},
    {n: "Chicken Rice", t: ["chicken"]}, {n: "Pork Rice", t: ["pork", "gluten"]},
    {n: "Beef Soup", t: ["beef", "gluten"]}, {n: "Spaghetti", t: ["dairy", "pork", "gluten"]},
    {n: "Cheese Pizza", t: ["dairy", "gluten"]}, {n: "Burger", t: ["pork", "gluten", "egg"]},
    {n: "Green Curry", t: ["chicken", "spicy"]}, {n: "Omelet", t: ["egg", "pork"]},
    {n: "Fried Fish", t: ["fish"]}, {n: "Tofu Soup", t: ["pork"]},
    {n: "Duck Rice", t: ["pork"]}, {n: "Sukiyaki", t: ["seafood", "pork", "egg"]},
    {n: "Fish Soup", t: ["fish"]}, {n: "Larb Pork", t: ["pork", "spicy"]},
    {n: "Grilled Chicken", t: ["chicken"]}, {n: "Shrimp Cake", t: ["seafood", "gluten"]},
    {n: "Basil Chicken", t: ["chicken", "egg", "spicy"]}, {n: "Morning Glory", t: ["spicy"]},
    {n: "Crab Rice", t: ["seafood", "egg"]}, {n: "Salmon", t: ["fish"]}, {n: "Sushi", t: ["fish", "gluten"]}
  ];

  let CheckBox = document.getElementById('cList');
  tags.forEach(tag => {
    CheckBox.innerHTML += `<label><input type="checkbox" value="${tag}" onchange="updateList()"> ${tag}</label>`;
  });

  let available = [];
  function updateList() {
    let checked = Array.from(document.querySelectorAll('input:checked')).map(cb => cb.value);
    available = foods.filter(f => !f.t.some(x => checked.includes(x)));
    document.getElementById('count').innerText = "Available: " + available.length + " items";
    
    if(available.length === 0) {
      document.getElementById('status').innerText = "Error";
      document.getElementById('result').innerText = "No food available!";
    } else {
      document.getElementById('status').innerText = "Ready";
      document.getElementById('result').innerText = "Click random button";
    }
  }

  function pickFood() {
    if(available.length === 0) {
      alert("Please uncheck some filters!");
      return;
    }
    let count = 0;
    document.getElementById('status').innerText = "Randomizing...";
    let timer = setInterval(() => {
      let rand = available[Math.floor(Math.random() * available.length)].n;
      document.getElementById('result').innerText = rand;
      count++;
      if(count > 8) {
        clearInterval(timer);
        document.getElementById('status').innerText = "Selected:";
      }
    }, 50);
  }

  updateList();
</script>

</body>
</html>
